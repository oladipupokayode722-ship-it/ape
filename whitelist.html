<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#5a18e5"><link rel="stylesheet" href="style.css"><meta property="og:type" content="website"><meta property="og:title" content="Whitelist | Ink Genesis Apes"><meta property="og:description" content="2,222 hand-drawn Apes. The First Ape Collection on Ink."><meta property="og:image" content="https://YOUR-SITE.vercel.app/og-image.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:site" content="@ApeonInk"><meta name="twitter:image" content="https://YOUR-SITE.vercel.app/og-image.png"><title>Whitelist | Ink Genesis Apes</title></head><body>
